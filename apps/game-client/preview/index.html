button,input,select{font-family:var(--sans)}
.app-shell{max-width:1600px;grid-template-columns:minmax(225px,260px) minmax(405px,1fr) minmax(240px,285px);gap:clamp(14px,2.5vw,30px);padding:22px 30px 28px}
.panel{border:1px solid #e5d6b8;box-shadow:0 10px 28px #325c5530,0 0 0 3px #fff8 inset;background:linear-gradient(155deg,#fffdf5ed,#fff8e9f2 77%,#f2f5eaf2);border-radius:19px}
.brand-row{color:var(--deep)}.brand-mark{border:2px solid #e3bf83;color:#fff4d9;background:linear-gradient(145deg,#2c938f,#195e60);border-radius:15px;box-shadow:inset 0 0 0 2px #abd5c4,0 3px 13px #216d663b}
.brand-title{font:800 23px var(--serif);letter-spacing:.08em}.small-caps{color:#a88d5e}
.side-lead{color:#738b7d}.side-title{font:700 12px var(--serif);letter-spacing:.14em;color:#997d56;border-bottom:1px solid #e9dac2;padding-bottom:8px}
.route-row{font-weight:600;border-bottom:1px solid #e6ece43d;border-radius:8px;color:#55746e}
.route-row.active{background:linear-gradient(105deg,#277f7a,#5baea0);color:#fff;box-shadow:inset 0 0 0 1px #d9eee0a6,0 3px 10px #2a75653b}
.route-row.active .route-id{color:#c6ebe1}.routes-list{max-height:42vh}
.side-button{border:1px solid #cfb07b;background:linear-gradient(180deg,#fff7e7,#f8ecd3);border-radius:10px;box-shadow:0 2px 0 #d0b68c;color:#47766a}
.side-button:not(.ghost):first-of-type{background:linear-gradient(180deg,#f2b394,#df7e63);border-color:#d4a16c;color:white}
.tag{border-color:#d3b77a;background:linear-gradient(#fff8e8,#f4e8ce);color:#7b7358}
.qa-row,.dev-stat{background:#fffaee;border:1px solid #e8dfcb}.qa-row button{background:#e2f3e9}.qa-list{max-height:31vh}
.center-caption{color:#6e9289;font-family:var(--serif);font-weight:700;letter-spacing:.1em}
.device{background:var(--cream);border:6px solid #f6f4dd;border-radius:43px;box-shadow:0 0 0 1px #6db2a8,0 0 0 4px #dcece1,0 26px 60px #28786c49,inset 0 0 0 2px #fff8e7}
.device:before{background:#113d3d;height:14px;width:88px;top:3px;border-radius:8px;box-shadow:0 0 0 3px #d7eeea}
.statusbar{height:30px;background:linear-gradient(180deg,#c8ece8,#d9f2ee);color:#245b58;font-family:var(--sans);border-bottom:0;padding:0 18px}
.phone-header{background:linear-gradient(180deg,#d4f2ee 0%,#c9ede9 100%);min-height:57px;border-bottom:2px solid #97d1c3;box-shadow:0 2px 9px #2f7e722a;position:relative}
.phone-header:after{content:'';position:absolute;bottom:0;left:27%;right:27%;height:1px;background:linear-gradient(90deg,transparent,#c3a16a,transparent)}
.phone-header h2{font:800 17px var(--serif);letter-spacing:.07em;color:#195f61;max-width:165px;text-shadow:0 1px 0 #fff}
.back-button{width:29px;height:29px;border:1px solid #c0e0cf;background:#f8fbecae;border-radius:50%;padding:3px;color:#367c76}
.header-right{gap:3px}.tiny-wallet{border:1px solid #dec991;background:linear-gradient(#fff8e7,#f2e8d0);padding:4px 6px;color:#976c26;font-size:9px;box-shadow:0 2px 3px #a78e5e20}
.tiny-action{background:#f6f5e4;border:1px solid #cfcba9;border-radius:50%;color:#30716a}
.phone-scroll{background:linear-gradient(180deg,#ebf9f5 0%,#fffaf0 32%,#fff9ef 100%);scrollbar-color:#a2cbbf transparent}
.device[data-route^="PG-8"] .phone-scroll{background:linear-gradient(180deg,#eff7f4,#fffdfa 34%,#f6f5eb)}
.device[data-route^="PG-6"] .phone-scroll{background:linear-gradient(180deg,#d8f1e9,#fff5e9 47%,#f7f2e7)}
.device[data-route^="PG-2"] .phone-scroll,.device[data-route^="PG-3"] .phone-scroll{background:linear-gradient(180deg,#e3f6ef,#fff8e8 42%,#faf3e7)}
.screen{padding:15px 15px 26px}
.phone-nav{height:71px;background:linear-gradient(180deg,#d4f0e9,#b8ded4 100%);border-top:2px solid #86c2b8;box-shadow:0 -3px 12px #426c6736;padding:5px 2px 7px}
.nav-item{position:relative;color:#3e827d;font-size:10px;gap:3px;font-weight:800;text-shadow:0 1px #eefaf1}
.nav-item svg{width:27px;height:27px;padding:5px;border-radius:12px;border:1px solid #d1e9d2;background:linear-gradient(140deg,#fff7dd,#dcf0e1);box-shadow:0 2px 0 #90b9a9;stroke-width:2.25}
.nav-item.active{color:#174f50}.nav-item.active svg{background:linear-gradient(135deg,#fff0c0,#edba73);border-color:#d1a35c;box-shadow:0 2px 0 #a87835,inset 0 0 0 1px #fff6df}
.nav-item.active .nav-dot{background:#f08b6e;width:14px;height:3px;border-radius:2px}
.screen-title{font:800 21px/1.45 var(--serif);color:#1b6261;letter-spacing:.05em;text-shadow:0 1px 0 #fff}
.screen-sub{font-size:11px;color:#7f9181}.eyebrow{color:#70988b;letter-spacing:.12em;font-size:9px}
.section-bar{margin:18px 0 11px;position:relative;padding-left:13px;min-height:24px}
.section-bar:before{content:'❧';position:absolute;left:0;top:-2px;color:#d2a56b;font-family:var(--serif)}
.section-bar b{color:#3d665c;font:800 15px var(--serif)}.section-bar small{color:#998c72}
.soft-card,.muted-card,.warm-card,.tile,.click-card,.feature-banner,.product-card{border:1px solid #dcc9a5;box-shadow:0 2px 0 rgba(255,255,255,.95) inset,0 3px 9px #9583601b;}
.soft-card,.click-card,.tile,.product-card{background:linear-gradient(160deg,#fffdfa,#fff6e5)}
.soft-card{border-radius:15px;padding:14px}.muted-card{background:linear-gradient(#f5faf1,#ecf4e9);border-color:#cbdcce;border-radius:13px}.warm-card{background:linear-gradient(145deg,#fff8e8,#f9eed4);border-radius:15px}
.click-card{border-radius:13px;margin:8px 0;transition:transform .16s,box-shadow .16s}.click-card:hover{transform:translateY(-1px);box-shadow:0 4px 15px #8f785036}.click-card:active{transform:translateY(1px)}
.circle-icon{border:1px solid #d6bb88;background:radial-gradient(#fff9d9,#f1dfb3);color:#86764f;box-shadow:inset 0 0 0 2px #fff9e7;font-size:19px}
.secondary,.muted{color:#888d7f}.list-content small{color:#968e78}
.btn,.hero-main-btn{position:relative;overflow:hidden;min-height:42px;border-radius:13px;border:2px solid #e5bb78;background:linear-gradient(180deg,#51a399 0%,#207b78 47%,#17635e 100%);box-shadow:inset 0 0 0 2px #8ed0b9,inset 0 2px 0 #c3e5d6,0 3px 0 #bfa16b,0 5px 11px #29665b32;color:#fffdf0;text-shadow:0 1px 1px #276a5f;letter-spacing:.025em;font-weight:800;transition:transform .13s,filter .13s}
.btn:before,.hero-main-btn:before{content:'';position:absolute;pointer-events:none;top:2px;left:10%;right:10%;height:30%;border-radius:90%;background:linear-gradient(180deg,#fff9e74b,transparent)}
.btn:not(:disabled):hover,.hero-main-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:not(:disabled):active,.hero-main-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #fff3c1,0 1px 0 #bfa16b}
.btn.coral-bg,.hero-main-btn{background:linear-gradient(180deg,#ffb59b 0%,#f19072 44%,#e27b60 100%);border-color:#e4b677;box-shadow:inset 0 0 0 2px #ffdfae,inset 0 2px 0 #fff8d0,0 3px 0 #bb8551,0 5px 12px #bb6f4c5e;color:#fffdf3;text-shadow:0 1px 1px #ab644d}
.btn.light,.btn.outline,.btn.ghost{background:linear-gradient(180deg,#fffdf0,#f6eccc);color:#50746b;text-shadow:none;border:1px solid #c9ad78;box-shadow:inset 0 0 0 2px #fffdf8,0 2px 0 #d9bd91,0 4px 8px #82745525}
.btn.ghost{background:#fffaec70;border-color:#e1d6bc;box-shadow:inset 0 0 0 1px #fff9e7;color:#6e8d83}
.btn.gold-bg{background:linear-gradient(#f4d597,#bf9058);border-color:#f4d9aa}
.btn.sm{min-height:30px;padding:5px 8px;border-radius:9px}.btn.mini{min-height:27px;border-radius:8px;padding:4px 7px}
.pill{border:1px solid #c3dccc;background:linear-gradient(#f4fbef,#e5f5e9);color:#468075}.pill.amber{border-color:#e9c991;background:linear-gradient(#fff9e6,#ffeac1);color:#a07836}.pill.coral-bg{background:#ffede0;border-color:#f6c6ad;color:#b36d50}
.money,.item-price{color:#bf634c}.big-number{font-family:var(--serif);color:#196963}.text-sm{line-height:1.55}

.feature-banner h3{font:800 18px var(--serif);color:#32726b}.feature-banner p{color:#718e83}.profile-photo{background:linear-gradient(145deg,#d7f3ed,#fff5de)}
.market-cover{border:1px solid #e7c596;box-shadow:0 3px 10px #4d776529;object-position:center center}

.stall-scene:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#164e4696,transparent 69%)}
.stall-scene:after{content:'❖　今日开摊 · 欢迎淘宝';position:absolute;bottom:13px;left:16px;color:#fff8da;text-shadow:0 2px 4px #184e45;font:700 13px var(--serif);letter-spacing:.08em}
.stall-scene .scene-name{position:absolute;z-index:1;top:20px;left:16px;right:16px;color:#fff9db;text-shadow:0 2px 7px #0a4447;font:900 25px var(--serif)}
.stall-scene .scene-sub{position:absolute;z-index:1;top:53px;left:16px;color:#d5f7e8;font-size:11px}
.stall-scene .scene-avatar{position:absolute;z-index:2;right:15px;bottom:5px;width:104px;height:130px;object-fit:contain;filter:drop-shadow(0 5px 5px #153d382c)}
.subnav{background:#ecf6ed;border:1px solid #c6d9c5}.subnav button{font:800 11px var(--serif)}.subnav button.active{border:1px solid #d3ad75;color:#885f39;background:linear-gradient(#fff9de,#f4e0bc)}
.product-grid{gap:9px}.product-card{border-radius:14px;background:linear-gradient(#fffdf0,#f9eedb);padding:7px;box-shadow:0 2px 0 #fff inset,0 3px 9px #a99e8030;transition:transform .12s,box-shadow .12s}
.product-card:not(:disabled):active{transform:scale(.977)}.product-card:hover{border-color:#ca9b57;box-shadow:0 4px 14px #ad98642b}
.product-card strong{font:800 12px var(--serif);color:#3b5e53;margin:8px 3px 4px}
.product-visual{height:134px;border:1px solid #e9d5aa;border-radius:11px;background:radial-gradient(ellipse at 50% 32%,#fffdf6,#dfece2 70%,#d9e6da);box-shadow:inset 0 5px 16px #8aab9f1a,inset 0 -6px 14px #c8bf9b21;position:relative;overflow:hidden}
.product-visual:before{content:'';position:absolute;bottom:3px;left:19%;width:62%;height:15px;background:radial-gradient(ellipse,#907c5d42,transparent 68%);filter:blur(3px)}
.product-visual svg{width:92%!important;height:95%!important;filter:drop-shadow(0 7px 4px #344d3d30)}
.object-stage{min-height:308px;border:3px solid #c6b086;border-radius:20px;background:radial-gradient(circle at 50% 43%,#527c77 0,#214f51 64%,#173e45 100%);box-shadow:0 3px 0 #fff7dd inset,inset 0 -19px 28px #153c3b5f,0 4px 13px #366f6933;isolation:isolate}
.object-stage:before{content:'';position:absolute;bottom:13px;left:20%;width:60%;height:26px;border-radius:50%;background:radial-gradient(ellipse,#d6ad6e,#896d4e 70%,transparent 71%);box-shadow:0 0 0 2px #f2ddb485,0 11px 11px #143e3a90;z-index:-1}
.object-stage:after{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(120deg,#e1f9f21e,transparent 50%);pointer-events:none}
.object-stage svg{width:min(280px,83%);height:270px;filter:drop-shadow(0 14px 10px #0a262a78) brightness(1.06)}
.object-stage .hotspot{width:34px;height:34px;background:linear-gradient(160deg,#ffeac1,#ec8b69);border:2px solid #fff8d0;color:#8f5e37;box-shadow:0 3px 8px #091b2440;font-weight:900}
.object-stage .hotspot.seen{background:#66b7a8;color:white}
.thumbnails{margin:9px 0 12px}.thumbnails button{background:linear-gradient(#fffcef,#f2e2c4);border:1px solid #d5b783;color:#79735c;padding:9px 0;font-weight:700}.thumbnails button.active{background:linear-gradient(#4c9790,#267b73);border-color:#d9b06d;color:#fff}
.evidence-row{border:1px solid #e1cba6;background:linear-gradient(#fffdf7,#fff5e5);border-radius:11px;padding:11px 9px;box-shadow:0 2px 0 #fff inset}
.evidence-row .num{background:#e5f6eb;color:#3e8779;border:1px solid #bfdbc7}.evidence-row.seen{border-color:#90c7ab;background:#f1f8ed}
.evidence-row b{font:800 12px var(--serif)}.evidence-row div{color:#716e61}
.choice{background:linear-gradient(#fffdf5,#f9f0e0);border:1px solid #dfc79c;box-shadow:inset 0 1px #fff;border-radius:11px;min-height:56px}
.choice.active{background:linear-gradient(#e6f6ed,#d3ebdf);border-color:#67a994;box-shadow:inset 0 0 0 1px #b7d4c3}.choice .radio{border-color:#baad89}.choice.active .radio{border-color:#2e8a7d}
.seller-speech{position:relative;border:1px solid #d9bd88;background:linear-gradient(#fffaf0,#f7e8c7);border-radius:11px;padding:14px;color:#795b3c;box-shadow:0 3px 5px #92765627;font:500 13px/1.8 var(--serif)}
.offer-range{accent-color:#e8886d}.offer-range::-webkit-slider-thumb{box-shadow:0 0 0 5px #f9dbaa}
.fancy-report{border:2px solid #d7b87e;border-radius:15px;background:linear-gradient(145deg,#fffefa,#fff2db);box-shadow:0 0 0 3px #fff8e6 inset,0 5px 12px #87725d33;padding:13px}
.result-stamp{font:900 22px var(--serif);color:#c95649;border:3px double #c95649;transform:rotate(-9deg);border-radius:6px;padding:6px 11px;box-shadow:inset 0 0 0 2px #fff8df}
.fancy-report .object-stage{min-height:230px;width:100%}.fancy-report .object-stage svg{height:215px}.fancy-report .object-stage:before{bottom:8px}
.book-cover{border:2px solid #d9bd8b;background:linear-gradient(150deg,#fff8e9,#e6f3e9);border-radius:11px;box-shadow:inset 0 0 0 3px #fffdf5,0 3px 13px #8b957d29}
.museum-img{border-radius:7px}.warning{border:1px solid #dfbe83;background:linear-gradient(#fff8e8,#f9ebcb);color:#9a764c}
.callout{background:linear-gradient(#fff4e0,#eaf6e8);border-color:#dfcb9c}.chip{border-color:#d8c195;background:linear-gradient(#fffdf5,#f6eddd);color:#826e50}.chip.active{background:linear-gradient(#4ba49a,#217f79);color:#fff;border-color:#cdab7c}
.form-input{border:1px solid #d2bb93;background:#fffaf0;box-shadow:inset 0 2px 6px #af93641b}
.modal-backdrop{background:#112f2bb3;backdrop-filter:blur(5px)}.modal{background:linear-gradient(155deg,#fffcf4,#f8eddb);border:3px double #c4a36e;border-radius:18px;box-shadow:0 15px 0 -6px #f0d5a6,0 23px 48px #142c2890,inset 0 0 0 3px #fffae7}
.modal h3{font:800 20px var(--serif);color:#28655b}.modal p{color:#74634f}.toast{border:1px solid #efd49c;background:linear-gradient(130deg,#145953,#2a7770);color:#fff7e6;border-radius:13px;box-shadow:0 5px 0 #b79c65,0 8px 18px #123d3c4d}
.market-map{background:linear-gradient(155deg,#e5f4e7,#f0e9cf);border:2px solid #c8b583;gap:7px}.map-node{border:1px solid #d0b98d;background:linear-gradient(#fff9e5,#f4e4c8);border-radius:10px;color:#4f766e;box-shadow:0 2px 0 #e5c994}.map-node b{font:700 11px var(--serif)}
.empty-state{background:linear-gradient(#fffdf4,#f8efdf);border:1px dashed #d4c59f;border-radius:14px}
.chapter-progress span.done{background:linear-gradient(90deg,#75c8ac,#3a9484)}
.soft-card .progress>span{background:linear-gradient(90deg,#7cc8a7,#3e9b91)}

.device[data-route="PG-00"] .market-hero{min-height:380px;background-position:center center}
.device[data-route="PG-11"] .phone-scroll{background:linear-gradient(180deg,#deeddf,#fffae9 34%,#f9eddb)}
.device[data-route="PG-12"] .phone-scroll{background:linear-gradient(180deg,#e4f5ec,#f8f3e3)}

.device[data-route="PG-60"] .person-row .npc-avatar{width:120px;height:142px;align-self:center}
.device[data-route="PG-61"] .person-row .npc-avatar{width:126px;height:156px}
.device[data-route="PG-80"] .book-cover{min-height:240px}
.device[data-route="PG-50"] .soft-card:has(.gold){background:linear-gradient(150deg,#fffcf1,#e5f7e9)}
/* overlays for visual realism */
.is-highlighted{animation:goldPulse .85s ease-out}@keyframes goldPulse{from{box-shadow:0 0 0 0 #e9bb78e0}to{box-shadow:0 0 0 15px #e9bb7800}}
@media(max-width:1250px){.app-shell{grid-template-columns:minmax(180px,225px) minmax(390px,1fr);padding:16px 20px;gap:18px}}
@media(max-width:820px){body{background:#d7ede6}.app-shell{display:block;padding:0}.control-panel,.dev-panel,.center-caption{display:none!important}.device{width:100%;height:100dvh;max-width:none;border:0;border-radius:0;box-shadow:none}.device:before{display:none}.phone-scroll{scrollbar-width:none}.market-hero{height:clamp(340px,54vh,480px)}.btn{min-height:45px}.btn.sm{min-height:35px}}
@media(max-width:370px){.phone-header h2{font-size:15px;max-width:128px}.tiny-wallet{font-size:9px;padding:3px}.screen{padding:12px}.section-bar b{font-size:14px}.product-card strong{font-size:11px}.nav-item{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* Selected artifact with matched closeup artwork and four clickable study details */
.special-porcelain{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px #314b494f)}
.object-stage>.special-porcelain{width:97%;height:300px;object-fit:cover;object-position:center}
.observation-detail{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center;margin:7px 0 15px;padding:8px;border:1px solid #dbc29b;background:linear-gradient(120deg,#fffdf3,#f6e9cf);border-radius:14px;box-shadow:inset 0 0 0 2px #fffbef,0 3px 9px #93856f2a}
.observation-crop{position:relative;width:100px;height:86px;border:2px solid #d1b17b;border-radius:9px;background:radial-gradient(#e3f3eb,#b7d3c4);overflow:hidden}
.observation-crop.actual-crop img{width:100%;height:100%;object-fit:cover}
.observation-crop .illustration-crop{width:180%;height:170%;transform:translate(-21%,-18%)}
.observation-crop .illustration-crop svg{height:100%;width:100%}.observation-caption span{display:block;font-size:9px;letter-spacing:.05em;color:#a78b59}.observation-caption b{display:block;font:800 13px var(--serif);color:#38695f;margin:4px 0}.observation-caption small{display:block;font-size:10px;line-height:1.6;color:#8c8170}
.bargain-intro{min-height:175px;overflow:hidden;position:relative;background:linear-gradient(100deg,#f5ead3,#dbf1e7);padding-right:95px}
.bargain-intro .seller-row{position:relative;z-index:2}.bargain-intro .seller-row .npc-avatar{width:58px;height:65px}.bargain-intro .seller-row>div{max-width:220px}.bargain-portrait{position:absolute;right:-1px;bottom:-12px;width:138px;height:164px;object-fit:cover;object-position:center top;filter:drop-shadow(0 4px 6px #3357472e);opacity:.97;z-index:1;pointer-events:none}
.bargain-intro .row.between{position:relative;z-index:2}
.heritage-report .result-stamp{box-shadow:inset 0 0 0 2px #fff5e4,0 1px 2px #b86b5363}
.heritage-report>.object-stage{border:2px solid #bfa777}
.shop-parchment{border:1px solid #e0c18c}
.feature-banner{overflow:hidden}.feature-art{height:122px;max-width:43%;object-fit:contain;object-position:center bottom;align-self:flex-end;filter:drop-shadow(0 5px 4px #59897943);pointer-events:none}.feature-banner>div:first-child{position:relative;z-index:1;max-width:62%}
.token-art{display:block;width:174px;height:152px;object-fit:contain;margin:10px auto 9px;filter:drop-shadow(0 10px 10px #97734b34);animation:medalFloat 4s ease-in-out infinite}
@keyframes medalFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* Touch ergonomics: keep critical game interactions usable without changing action handlers */
.market-map .map-node{min-height:82px}.stall-switch button{min-height:38px;padding:7px 9px}
.tiny-action{min-width:34px;min-height:34px}.back-button{min-width:34px;min-height:34px}
.chip{min-height:36px}.thumbnails button{min-height:40px}.choice{min-height:56px}
.quick-link{min-height:62px}.product-card{min-height:182px}.product-card.sold{min-height:182px}
.phone-nav .nav-item{min-height:59px}

/* V1.6.1 — unified collection & store game hub */
.museum-hub{padding:13px 14px 24px!important;background:linear-gradient(180deg,#f4fcf7 0%,#fbfaf3 70%,#f6f6ed 100%)}
.museum-hub .screen-title{margin:3px 0 11px;letter-spacing:.05em;color:#17645f}
.museum-hero{min-height:176px;display:flex;position:relative;align-items:center;overflow:hidden;border-radius:22px;padding:17px 11px 19px 18px;background:linear-gradient(132deg,#d8eee5 0%,#e9f4e9 47%,#fdf5e3 100%);border:1px solid #d5e7d7;box-shadow:0 9px 22px rgba(32,95,78,.09)}
.museum-hero:before{content:"";position:absolute;inset:5px;border:1px solid rgba(248,250,233,.9);border-radius:18px;pointer-events:none}
.museum-hero:after{content:"";position:absolute;width:190px;height:80px;border:1px solid rgba(121,167,152,.24);border-radius:100%;transform:rotate(-20deg);top:-50px;right:-28px;pointer-events:none}
.museum-hero-copy{flex:1 1 52%;position:relative;z-index:2;min-width:0}
.museum-hero-kicker{font-size:10px;letter-spacing:.12em;font-weight:900;color:#719689}
.museum-hero h3{font-size:21px;letter-spacing:.04em;color:#206a63;margin:6px 0 8px;font-family:'Songti SC','Noto Serif SC',serif;font-weight:900}
.museum-hero p{font-size:11px;line-height:1.7;color:#547d71;margin:0 0 10px}
.museum-level{display:inline-block;border:1px solid #c89a62;background:linear-gradient(120deg,#fdf6e6,#f1dbb8);color:#93682f;font-size:10px;padding:5px 10px;border-radius:14px;font-weight:900}
.museum-hero-art{width:45%;max-width:174px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(30,86,71,.18));position:relative;z-index:1}
.museum-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;gap:7px}
.museum-stats>div{border:1px solid #e3e9d7;min-width:0;padding:11px 3px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(160deg,#fffdf8,#f3f9f2);border-radius:13px;box-shadow:0 3px 9px #246d6a08}
.museum-stats b{font-size:21px;font-weight:900;color:#2b7772;font-variant-numeric:tabular-nums}.museum-stats b small{font-size:11px;color:#9caf9d}
.museum-stats span{color:#82978f;font-size:10px;font-weight:700}
.museum-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:15px 0 8px;padding:4px;background:#edf6ed;border:1px solid #d7e7d8;border-radius:16px}
.museum-tab{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;border:1px solid transparent;border-radius:12px;min-height:51px;background:transparent;color:#6c9587;font-size:11px;font-weight:800;padding:4px 0;transition:background .18s,transform .18s}.museum-tab svg{stroke-width:1.8}.museum-tab.active{background:linear-gradient(145deg,#fffdf2,#fffae7);border-color:#d7c28c;color:#236e65;box-shadow:0 3px 10px #5f876d1f}.museum-tab:active{transform:scale(.96)}
.museum-tab-panel{min-height:210px}.museum-help{font-size:11px;line-height:1.65;color:#829b91;margin:5px 0 10px}
.museum-owned-list{display:grid;gap:8px}.museum-owned{display:flex;align-items:center;gap:5px;border:1px solid #e4e9db;border-radius:15px;background:#fffdf6;padding:6px 8px;box-shadow:0 4px 12px #1b76620a}.museum-owned-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;border:0;background:none;padding:3px 1px;color:inherit}.museum-owned-main .product-visual{width:68px;height:66px;flex:none;border:1px solid #e6eadb;border-radius:11px}.museum-owned-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;gap:5px}.museum-owned-copy>b{font-size:12px;font-weight:850;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.museum-owned-copy small{font-size:9px;color:#78968e}.museum-owned-more{display:flex;align-items:center;gap:4px;font-size:10px;color:#238178;font-weight:700}.museum-mini-action{flex:none;background:linear-gradient(160deg,#faede0,#f8dbb6);border:1px solid #d5b580;box-shadow:0 2px 0 #caad7a;border-radius:10px;padding:7px 9px;color:#98642b;font-size:10px;font-weight:850}.museum-mini-action.placed{background:linear-gradient(150deg,#e7f6ec,#cce8d9);border-color:#a6cebd;color:#337e65;box-shadow:0 2px 0 #aac6b6}
.museum-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 5px}.museum-actions .btn{min-width:0}

价值。","tip":"铭文内容来自馆藏编目，不能依图片自行推定铸造者与真伪。"},{"id":"KA0004","date":"2026-11-14","name":"西周青铜簋","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/53558/157425/main-image","src":"https://www.metmuseum.org/art/collection/search/53558","age":"西周，公元前10世纪","material":"青铜","category":"青铜器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"13.100.155","focus":"观察双耳、圈足、凸起乳钉和几何纹样。","intro":"簋是盛放谷物的礼器。它与鼎等器物一起体现古代礼制的器物组合，也适合作为辨识青铜器基本器形的入门例子。","tip":"器形知识是欣赏入口，不是普通玩家可独立完成的真伪鉴定依据。"},{"id":"KA0005","date":"2026-11-15","name":"汉代谷纹兽面纹玉璧","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/42838/2513413/main-image","src":"https://www.metmuseum.org/art/collection/search/42838","age":"汉代，公元前206年至公元220年","material":"软玉（nephrite）","category":"玉器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"17.118.44","focus":"观察中央穿孔、细密谷纹与边缘兽面纹。","intro":"璧是一种中间开孔的圆形玉器。这件玉璧将重复排列的纹样与外缘装饰结合，适合学习传统玉器形制和纹样层次。","tip":"天然色差和沁色的外观不能单独证明年代。"},{"id":"KA0006","date":"2026-11-16","name":"北魏石雕菩萨头像","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/42714/163676/main-image","src":"https://www.metmuseum.org/art/collection/search/42714","age":"北魏，5世纪晚期","material":"砂岩，残留彩绘痕迹","category":"石雕","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"42.25.11","focus":"观察面部线条、发髻处理和砂岩表面。","intro":"石雕留下了北朝造像审美与工艺的线索。藏品编目记载表面存有彩绘痕迹，说明今天看到的素色石像未必是历史上的完整视觉样貌。","tip":"仅凭照片无法判断残损形成时间或修复细节。"},{"id":"KA0007","date":"2026-11-17","name":"南宋龙泉窑青瓷莲瓣碗","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/52634/81977/main-image","src":"https://www.metmuseum.org/art/collection/search/52634","age":"南宋，12—13世纪","material":"青釉刻饰/模印石器（龙泉窑）","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"50.221.18","focus":"仔细看碗外壁莲瓣式浮雕和青釉的层次。","intro":"莲瓣装饰是龙泉窑青瓷的重要学习线索之一。造型、纹饰与釉色共同构成器物的审美，而不仅是“青色”一个特征。","tip":"这件馆藏官方图像为黑白影像；不要根据图片猜测真实釉色。"},{"id":"KA0008","date":"2026-11-18","name":"南宋龙泉窑修补青瓷碗","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/48450/194942/main-image","src":"https://www.metmuseum.org/art/collection/search/48450","age":"南宋，13世纪","material":"龙泉窑青釉石器，金漆修补","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"17.57.1","focus":"看青绿色釉面上显眼的金色修补位置。","intro":"修补痕迹也属于藏品历史的一部分。通过此件可以讨论修复方式如何改变器物观感，以及“旧痕”和“品相”的不同含义。","tip":"金漆修补是馆藏编目内容，不代表玩家应自行修复真实文物。"},{"id":"KA0009","date":"2026-11-19","name":"元代青花透雕小罐","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/44741/99800/main-image","src":"https://www.metmuseum.org/art/collection/search/44741","age":"元，14世纪","material":"青花瓷，透雕与浮雕装饰","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"1991.253.30","focus":"观察器身镂空开窗、青花边线及内侧浮雕花纹。","intro":"这件小罐同时运用透雕、浮雕与釉下蓝彩，说明瓷器欣赏可以从装饰工艺组合入手。","tip":"青花与镂空并不是特定朝代的唯一特征。"},{"id":"KA0010","date":"2026-11-20","name":"明代青花缠枝莲纹罐","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/48640/84121/main-image","src":"https://www.metmuseum.org/art/collection/search/48640","age":"明，16世纪晚期","material":"景德镇青花瓷","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"67.55.41","focus":"看器腹枝蔓连绵的花卉布局和肩颈纹饰带。","intro":"缠枝纹用连续曲线组织花卉，形成重复而富有节奏的图案，是中国传统装饰纹样的经典学习对象。","tip":"本馆藏图像为黑白图，不应用它精确判断原作青花发色。"},{"id":"KA0011","date":"2026-11-21","name":"清顺治青花五彩麒麟纹罐","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/52798/1823954/main-image","src":"https://www.metmuseum.org/art/collection/search/52798","age":"清顺治时期，17世纪中叶","material":"景德镇釉下青花与釉上五彩瓷，木盖","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"19.28.2a, b","focus":"看画面中央麒麟与红、绿、蓝多色叠合的装饰关系。","intro":"麒麟是中国传统祥瑞形象。这件罐上的叙事性图案适合用来认识釉下彩与釉上彩在一个器物中的视觉组合。","tip":"器物题名与具体年代采用馆藏官方标注，不从单张图片推定窑口或真伪。"},{"id":"KA0012","date":"2026-11-22","name":"明代山水图轴","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/51552/2232563/main-image","src":"https://www.metmuseum.org/art/collection/search/51552","age":"明代（1368—1644）","material":"绢本立轴绘画","category":"书画","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"26.114.2","focus":"先找树木、建筑和山体层次，再观察画面的虚实和空间安排。","intro":"传统山水画往往通过留白、层层远山及笔墨关系表现意境。与瓷器和青铜器相比，书画更适合练习整体观看与细节放大的切换。","tip":"馆藏没有给出明确作者姓名；不得擅自归属名家。"},{"id":"KA0013","date":"2026-11-23","name":"清代孔雀蓝釉瓷罐","image":"https://collectionapi.metmuseum.org/api/collection/v1/iiif/46029/1297844/main-image","src":"https://www.metmuseum.org/art/collection/search/46029","age":"清，18世纪","material":"景德镇孔雀蓝釉瓷","category":"瓷器","museum":"大都会艺术博物馆（The Metropolitan Museum of Art）","accession":"17.120.147","focus":"观察通体蓝绿色釉面与器形轮廓。","intro":"单色釉器物的表现力主要来自釉色、光泽与器型。这件罐适合与邢窑白瓷和龙泉青瓷并读，认识不同釉色呈现方式。","tip":"同一种釉色也可出现于不同时代的器物，不能凭颜色单独断代。"}],"screens":[{"id":"PG-00","name":"启动加载","buttons":["V15-B001","V15-B002","V15-B003"]},{"id":"PG-01","name":"登录与协议","buttons":["V15-B004","V15-B005","V15-B006","V15-B007","V15-B008"]},{"id":"PG-03","name":"首次人设选择","buttons":["V15-B009","V15-B010","V15-B011","V15-B012","V15-B013"]},{"id":"PG-02","name":"前10分钟新手引导","buttons":["V15-B014","V15-B015","V15-B016","V15-B017","V15-B018"]},{"id":"PG-10","name":"市场首页","buttons":["V15-B019","V15-B020","V15-B021","V15-B022","V15-B023","V15-B024","V15-B025"]},{"id":"PG-11","name":"摊位详情","buttons":["V15-B026","V15-B027","V15-B028","V15-B029","V15-B030","V15-B031","V15-B032"]},{"id":"PG-12","name":"物件观察页","buttons":["V15-B033","V15-B034","V15-B035","V15-B036","V15-B037","V15-B038","V15-B039","V15-B040","V15-B041","V15-B042"]},{"id":"PG-15","name":"购买前个人判断","buttons":["V15-B043","V15-B044","V15-B045","V15-B046","V15-B047","V15-B048"]},{"id":"PG-13","name":"砍价交易","buttons":["V15-B049","V15-B050","V15-B051","V15-B052","V15-B053","V15-B054","V15-B055","V15-B056"]},{"id":"PG-14","name":"成交回执","buttons":["V15-B057","V15-B058","V15-B059","V15-B060"]},{"id":"PG-16","name":"鉴定服务选择","buttons":["V15-B061","V15-B062","V15-B063","V15-B064","V15-B065","V15-B066"]},{"id":"PG-17","name":"专家鉴定报告","buttons":["V15-B067","V15-B068","V15- function cash(n,type='奖励',note=''){S.cash+=n;S.ledger.unshift({id:'LED-'+Date.now()+'-'+S.ledger.length,day:S.day,type,delta:n,note});persist()}

function menuName(route){return (D.screens.find(x=>x.id===route)?.name||route).replace('·',' · ')}
function go(route, options={}){if(route==='PG-30'){App.museumTab='display';route='PG-20'}if(!D.screens.some(x=>x.id===route)){toast(`暂未登记页面：${route}`);return}if(App.route!==route)App.history.push(App.route);App.route=route;App.modal=null;if(route==='PG-60')App.dialogueResponse=null;if(!options.keep)App.scrollTop=0;if(route==='PG-11')ensureStall(App.selectedStall);if(route==='PG-12'){App.observedView=0;const l=currentListing();App.bid=l?l.ask:60}if(route==='PG-13'){App.bargainRound=0;App.bargainCounter=0;App.lastCounter=null;App.selectedStyle='friendly';const l=currentListing();App.bid=l?Math.max(5,round5(l.ask*.72)):60}render()}

function currentListing(){for(const arr of Object.values(S.market)){const l=arr.find(x=>x.id===App.selectedListing);if(l)return l}return null}

function ensureStall(stallId){if(S.market[stallId])return;const stall=STALL.get(stallId);if(!stall)return;const desired=D.slots[stallId]||[],out=[];for(const sl of desired){const item=ITEM.get(sl.id);if(!item)continue;const priorCount=[...S.inventory,...S.sold].filter(x=>x.itemId===item.id).length;out.push({id:`MK${S.day}-${stallId}-${sl.slot}`,stall:stallId,slot:sl.slot,itemId:item.id,ask:offerAsk(item,stallId,sl.slot),status:priorCount>=1?'sold':'sale',watched:false,day:S.day})}S.market[stallId]=out;persist()}

function getObserved(id){return S.observed[id]||[]}
function currentPriceForBuy(){const l=currentListing();return (App.acceptedOffer || l?.ask||0)}
function purchase(price,from='原价'){const l=currentListing();if(!l||l.status!=='sale')return toast('当前物品已经无法购买');const it=ITEM.get(l.itemId),cap=it.category==='古董真品'?1:(Number(it.maxPurchasesPerUser)||1),ownedCount=[...S.inventory,...S.sold].filter(x=>x.itemId===it.id).length;if(ownedCount>=cap)return modal('达到个人限购',`这件货品每个账号最多购买 ${cap} 次。`,[{label:'返回摊位','act':'go','to':'PG-11'}]);if(S.inventory.length>=S.capacity)return modal('仓库已满',`当前仓容 ${S.inventory.length}/${S.capacity}，请先出售或升级仓库。`,[{label:'去仓库',act:'go',to:'PG-21'}]);if(price>S.cash)return modal('现金不足',`需要 ${C(price)} C，当前持有 ${C(S.cash)} C。可先出售旧物或完成任务赚取现金。`,[{label:'去我的藏馆',act:'go',to:'PG-20'}]);const record={oid:`OWN${S.day}${Date.now()}${S.inventory.length}`,lid:l.id,itemId:l.itemId,stall:l.stall,price,day:S.day,status:'owned',appraisal:'none',conditionBonus:0,reportWaitingAt:null,featured:false,guess:structuredClone(S.guesses[l.id]||{category:'',reasons:[],confidence:'未记录'})};l.status='sold';S.inventory.unshift(record);if(it.category==='古董真品'&&!S.rareOwned.includes(it.id))S.rareOwned.push(it.id);cash(-price,'地摊购买',it.name);addXp(15);App.selectedOwnership=record.oid;App.acceptedOffer=null;if(it.id==='ITM007'&&!S.tutorialBuy){S.tutorialBuy=true;S.tutorialStep=5}change();go('PG-14')}

function submitBid(){const l=currentListing();if(!l||l.status==='sold')return toast('物品已售罄');const st=selectedStall(),round=(App.bargainRound||0)+1;if(round>3)return toast('该商品本轮砍价次数已用尽');const floor=round5(l.ask*st.floor);let bonus=App.selectedStyle==='friendly'?.02:App.selectedStyle==='flaw'?.05:App.selectedStyle==='rush'?.03:-.04;
 let observed=getObserved(l.id);if(App.selectedStyle==='flaw'&&!observed.length)return toast('请先查看至少一处实物特征，才能指出瑕疵。');if(App.selectedStyle==='rush'&&st.npc!=='NPC03')return toast('该摊主今天没有急售事件。');
 const npc=npcState(st.npc);const rapport=Math.min(.03,Math.floor(npc.trust/1)*.01);let tutorial=(l.itemId==='ITM007'&&!S.tutorialBuy)? .04:0;
 let threshold=Math.max(floor,round5(l.ask*(1-st.discount-bonus-rapport+.02*(round-1)-tutorial)));
 App.bargainRound=round;const bid=Number(App.bid)||0;
 if(bid>=threshold){App.acceptedOffer=bid;App.lastCounter=null;modal('谈成啦！',`${st.npcName}笑着点点头：${C(bid)} C，这件归你！确认后从现金中扣除并入库。`,[{label:`以 ${C(bid)} C 成交`,act:'confirm-bargain'},{label:'再考虑一下',act:'close'}]);}
 else if(bid<floor){App.lastCounter=null;toast(`太低啦！最低可谈区间尚未达到（剩余${3-round}次机会）。`)}else{App.lastCounter=threshold;toast(`${st.npcName}还价 ${C(threshold)} C，再谈谈？`)}change()}
function sellCurrent(){const o=ownership();if(!o||o.status==='sold')return toast('这件物品不在当前仓库');const it=ITEM.get(o.itemId);let price=quoteSale(o);const channel=App.sellChannel;let existing=S.sold.some(x=>x.oid===o.oid);if(existing)return toast('此物品已经出售。');o.status='sold';o.salePrice=price;o.saleChannel=channel;S.sold.unshift(o);S.inventory=S.inventory.filter(x=>x.oid!==o.oid);cash(price,'卖出藏品',it.name);if(o.itemId==='ITM007'&&!S.tutorialSold){S.tutorialSold=true;S.tutorialStep=8}addXp(26);App.storeTab='history';toast(`交易完成！到账 ${C(price)} C`);change();go('PG-23')}
function quoteSale(o){let it=ITEM.get(o.itemId),mul=App.sellChannel==='commission'?.9:App.sellChannel==='auction'?.92:.75;let price=Math.floor(it.value*(1+(o.conditionBonus||0)/100)*mul);if(o.itemId==='ITM007'&&!S.tutorialSold)return 180;return price}
function basicAppraisal(){const o=ownership();if(!o)return toast('请先拥有物品');if(o.appraisal!=='none')return toast('已经完成普通鉴定，无需重复扣费。');let cost=S.basicFreeDay===S.day?15:0;if(S.cash<cost)return modal('免费鉴定排队',`现金不足 ${cost} C。可以前往免费专家队列，或先出售其他藏品。`,[{label:'免费队列',act:'free-appraisal'}]);cash(-cost,'普通鉴定',ITEM.get(o.itemId).name);S.basicFreeDay=S.day;o.appraisal='basic';addXp(6);toast('普通鉴定完成：已显示基本分类和宽幅估值');change();go('PG-16')}
function expertAppraisal(mode='cash'){const o=ownership();if(!o)return toast('无有效物品');if(o.appraisal==='expert')return go('PG-17');if(mode==='cash'){if(S.cash<60)return toast('现金不足60 C');cash(-60,'专家鉴定',ITEM.get(o.itemId).name)}else if(mode==='cert'){if((S.tools.cert||0)<1)return toast('没有报告快通券');S.tools.cert--;}o.appraisal='expert';o.reportWaitingAt=null;S.knownItems.push(o.itemId);S.knownItems=[...new Set(S.knownItems)];addXp(15);change();go('PG-17')}
function freeAppraisal(){const o=ownership();if(!o)return toast('请先拥有物品');if(o.appraisal==='expert')return go('PG-17');o.reportWaitingAt=S.simHour+8;toast('已经进入免费专家队列，8小时后可领取完整报告。');change()}
function completeWaiting(){let count=0;for(const o of S.inventory.concat(S.sold)){if(o.reportWaitingAt!==null&&o.reportWaitingAt!==undefined&&o.reportWaitingAt<=S.simHour){o.appraisal='expert';o.reportWaitingAt=null;S.knownItems=[...new Set([...S.knownItems,o.itemId])];count++}}if(count)toast(`${count}份免费鉴定报告已经完成！`);persist()}
function newDay(){S.day++;S.market={};S.basicFreeDay=-1;for(const n of Object.values(S.npc)){n.chatCount=0;n.chatDay=-1}ensureStall('S01A');App.selectedStall='S01A';toast(`进入模拟第${S.day+1}天，摊位重新开市。`);change()}
function grantDemo(){S.logged=true;S.consent=true;S.persona=S.persona||'P01';S.demoUnrestricted=true;S.level=12;S.cash=Math.max(S.cash,18000);S.g=Math.max(S.g,280);S.tools={lens:8,uv:6,cert:6};S.capacity=Math.max(S.capacity,60);S.storeLevel=Math.max(S.storeLevel,4);S.market={};ensureAll();toast('已开启全链路测试档：Lv12、12摊位开放、演示资金与道具。');go('PG-10');change()}

function section(title,right=''){return `<div class="section-bar"><b>${title}</b>${right?`<small>${right}</small>`:''}</div>`}
function empty(emoji,msg){return `<div class="empty-state"><span class="emoji">${emoji}</span>${E(msg)}</div>`}

function view11(){const st=selectedStall();ensureStall(st.id);const ls=listings(st.id),n=NPC.get(st.npc),np=npcState(st.npc);return `<div class="screen"><div class="row between" style="margin-bottom:8px"><div><span class="eyebrow">STALL / ${st.id}</span><h2 class="screen-title" style="margin:2px 0">${E(st.name)}</h2></div><span class="pill">${ls.filter(l=>l.status==='sale').length}/10 在售</span></div><div class="soft-card seller-row">${npcAvatar(st.npc)}<div class="list-content"><b style="font-size:14px">${n.name} <span class="pill amber">熟悉度 ${np.aff}/100</span></b><div class="seller-text">${E(n.personality)}，${E(st.desc)}</div><div class="row" style="margin-top:8px">${button('聊聊天','chat','','sm coral-bg')}${button('人物档案','npc-profile',st.npc,'sm light')}</div></div></div><div class="subnav"><button data-act="paired-stall" data-id="${st.id.slice(0,3)}A" class="${st.id.endsWith('A')?'active':''}">A摊 · ${E(STALL.get(st.id.slice(0,3)+'A').name)}</button><button data-act="paired-stall" data-id="${st.id.slice(0,3)}B" class="${st.id.endsWith('B')?'active':''}">B摊 · ${E(STALL.get(st.id.slice(0,3)+'B').name)}</button></div>${section('摊上10件旧货','留意细节，别只看价格')}<div class="product-grid">${ls.map(l=>{let it=ITEM.get(l.itemId);return `<button class="product-card ${l.status==='sold'?'sold':''}" data-act="open-listing" data-id="${l.id}">${objectVisual(it)}<strong>${E(it.name)}</strong><div class="row between"><span class="item-price">${C(l.ask)} C</span><span class="pill gray">${l.status==='sold'?'售罄':'看一看'}</span></div>${l.status==='sold'?'<div class="sold-overlay">已卖出</div>':''}</button>`}).join('')}</div><div class="helper" style="margin-top:14px">每件物品有4条免费观察特征。购买前可以先记下判断，成交后不会立即公开真假。</div><div class="btnrow" style="margin:12px 0">${button('返回12摊总览','market-grid','','light')}${button('今日长见识','go','PG-80','outline')}</div></div>`}
function view12(){let l=currentListing(),it=listingItem();if(!l||!it)return empty('🔍','请先从地摊挑选物品');let seen=getObserved(l.id),used=S.toolUsed[l.id]||{},saved=S.guesses[l.id],watched=S.watch.includes(l.id);return `<div class="screen"><span class="eyebrow">ITEM OBSERVATION · ${it.id.replace('ITM','')}</span><div class="row between"><h2 class="screen-title" style="margin:6px 0">${E(it.name)}</h2><span class="pill">鉴定前 · 真假未知</span></div><div class="row between" style="margin:8px 0 11px"><span class="text-xs muted">来自 ${E(STALL.get(l.stall).name)}</span><span class="money">${C(l.ask)} C</span></div><div class="object-stage">${artifactSvg(it)}${[[7,11],[78,12],[18,76],[72,75]].map(([x,y],i)=>`<button class="hotspot ${seen.includes(i)?'seen':''}" style="left:${x}%;top:${y}%" data-act="observe" data-index="${i}">${seen.includes(i)?'✓':i+1}</button>`).join('')}</div><div class="thumbnails">${['正面','局部','纹饰','底足'].map((x,i)=>`<button class="${App.observedView===i?'active':''}" data-act="observe" data-index="${i}">${x}</button>`).join('')}</div>${section(`可见特征（${seen.length}/4）`,'点击图中编号或下方卡片')}<div>${it.observations.map((ob,i)=>`<button class="evidence-row ${seen.includes(i)?'seen':''}" style="width:100%;text-align:left" data-act="observe" data-index="${i}"><span class="num">${seen.includes(i)?'✓':i+1}</span><div><b>${E(ob.position)}</b>${seen.includes(i)?E(ob.text):'点击查看这处细节，免费观察'}</div></button>`).join('')}</div>${section('鉴宝小工具',`放大镜 ${S.tools.lens||0} · 紫光灯 ${S.tools.uv||0}`)}<div class="grid2"><button class="click-card" data-act="use-tool" data-id="lens"><span class="circle-icon">🔍</span><span class="list-content"><b>放大镜</b><small>${used.lens?'线索已揭晓':`剩余 ${S.tools.lens||0} 个`}</small></span></button><button class="click-card" data-act="use-tool" data-id="uv" ${it.uv?.startsWith('不支持')?'disabled':''}><span class="circle-icon">🔦</span><span class="list-content"><b>紫光灯</b><small>${it.uv?.startsWith('不支持')?'本件不适用':`剩余 ${S.tools.uv||0} 个`}</small></span></button></div>${used.lens?`<div class="helper" style="margin-bottom:10px">🔍 ${E(it.magnifier)}</div>`:''}${used.uv?`<div class="helper" style="margin-bottom:10px">🔦 ${E(it.uv)}</div>`:''}<div class="row between">${link('PG-50','购买鉴宝道具')}<button class="tip-link" data-act="watch">${watched?'♥ 取消关注':'♡ 收藏待观察'}</button></div><div class="btnrow" style="margin-top:13px">${button(saved?'修改我的判断':'记下我的判断','go','PG-15','light')}${button('与摊主砍价','go','PG-13','coral-bg')}</div><div style="height:8px"></div>${button(`按原价 ${C(l.ask)} C 购买`,'buy-direct','','outline full')}<div class="tooltip-dev">虚拟游戏物件 · 画面为风格演示插画，鉴定事实来自V1.5配置</div></div>`}
function view15(){let it=listingItem(),l=currentListing();if(!it)return empty('✎','未选中物品');return `<div class="screen"><span class="eyebrow">YOUR GUESS · BEFORE PURCHASE</span><h2 class="screen-title">先做一个判断</h2><p class="screen-sub">买之前，把你的猜测写下来。专家鉴定后会告诉你哪里看对了、哪里误判。</p><div class="soft-card row">${objectVisual(it,'product-visual')}<div style="min-width:130px"><b>${E(it.name)}</b><div class="text-xs secondary">摊主报价 ${C(l.ask)} C</div><span class="pill amber">真假仍未知</span></div></div>${section('你认为它属于哪一类？')}${['古董真品','老物件','古董赝品','普通工艺品'].map(x=>`<button class="choice ${App.selectedJudge===x?'active':''}" data-act="judge-category" data-value="${x}"><span class="radio"></span>${x}</button>`).join('')}${section('你依据哪些可见特征？','最多选择2条')}${it.observations.map((ob,i)=>`<button class="choice ${App.selectedReasons.includes(i)?'active':''}" data-act="judge-reason" data-index="${i}"><span class="check"></span><span>${E(ob.text)}</span></button>`).join('')}${section('你有多大把握？')}<div class="subnav">${['低','中','高'].map(x=>`<button data-act="judge-confidence" data-value="${x}" class="${App.judgementConfidence===x?'active':''}">${x}</button>`).join('')}</div>${button('保存判断，返回观察','save-guess','','coral-bg full')}<div style="height:9px"></div>${button('暂时没有把握','skip-guess','','ghost full')}</div>`}
function view13(){const l=currentListing(),it=listingItem(),st=selectedStall();if(!l||!it)return empty('🤝','请从物品观察页开始砍价');const max=3,round=App.bargainRound||0;return `<div class="screen"><span class="eyebrow">BARGAIN · ${st.id}</span><h2 class="screen-title">来，跟摊主谈谈价</h2><div class="soft-card"><div class="seller-row">${npcAvatar(st.npc)}<div><b>${st.npcName}</b><p class="seller-text">“诚心买，我也愿意让一步。”</p></div></div><hr class="separator"><div class="row between"><div class="text-sm">${E(it.name)}</div><b class="money">${C(l.ask)} C</b></div><div class="text-xs secondary">剩余谈价机会 ${max-round} / ${max}</div><div class="chapter-progress">${[0,1,2].map(i=>`<span class="${i<round?'done':''}"></span>`).join('')}</div></div>${section('这次你准备怎么说？')}${[['friendly','礼貌套近乎','先聊两句再出价'],['flaw','指出瑕疵','需先观察到物品特征'],['rush','摊主要收摊了','仅赶集清仓摊今日可选'],['hard','硬压价格','可能惹摊主不高兴']].map(([id,name,sub])=>`<button class="choice ${App.selectedStyle===id?'active':''}" data-act="bargain-style" data-value="${id}" ${id==='rush'&&st.npc!=='NPC03'?'disabled':''}><span class="radio"></span><span><b>${name}</b><br><span class="text-xs muted">${sub}</span></span></button>`).join('')}${section('我的出价',`${C(App.bid)} C`)}<input type="range" class="offer-range" id="bidSlider" min="5" step="5" max="${l.ask}" value="${Math.min(l.ask,App.bid)}"><div class="row between"><span class="text-xs secondary">5 C</span><b class="money" id="bidLabel">${C(App.bid)} C</b><span class="text-xs secondary">${C(l.ask)} C</span></div>${App.lastCounter?`<div class="warm-card" style="margin:12px 0"><b class="text-sm">💬 摊主还价：${C(App.lastCounter)} C</b><div class="text-xs muted">可以接受，也可以尝试再谈一次。</div>${button(`接受 ${C(App.lastCounter)} C`,'accept-counter','','coral-bg full sm')}</div>`:''}<div style="height:12px"></div>${button('提交本轮报价','submit-bid','','coral-bg full')}${button('退出砍价','go','PG-12','ghost full')}<div class="tooltip-dev">谈判门槛由摊主参数、已知瑕疵、关系与轮次构成；本演示在浏览器本地计算。</div></div>`}
function view14(){let o=ownership(),it=currentItem();if(!o||!it)return empty('🧺','你还没有成交物品');return `<div class="screen"><div class="center" style="padding:18px 0"><div style="font-size:51px">🎉</div><h2 class="screen-title">成交成功，入库啦！</h2><p class="screen-sub">买下来只是第一步，真正的故事还在后面。</p></div><div class="soft-card center">${objectVisual(it,'object-stage')}<h3 style="font-size:16px">${E(it.name)}</h3><span class="pill">当前状态：未经鉴定</span><div class="rowline"><span>实际成交价</span><strong class="money">${C(o.price)} C</strong></div><div class="rowline"><span>物品已入仓</span><strong>${S.inventory.length}/${S.capacity}</strong></div></div><div class="warning" style="margin:12px 0">温馨提示：此处不会提前公开真伪及隐藏估值。鉴定报告将提供新增证据与复盘。</div>${button('去鉴定这件宝贝','go','PG-16','coral-bg full guide-pulse')}<div class="btnrow" style="margin-top:9px">${button('查看库存','go','PG-22','light')}${button('继续逛摊','go','PG-11','outline')}</div>${button('查看本次现金流水','ledger','','ghost full')}</div>`}
function view16(){let o=ownership();if(!o||o.status==='sold'&&!o.appraisal)return `<div class="screen">${empty('🔍','请从仓库选择一件准备鉴定的物品。')}${button('挑选库存','go','PG-21','light full')}</div>`;if(!o)return `<div class="screen">${empty('🔍','请先购买一件地摊物件。')}${button('去市场','go','PG-10','light full')}</div>`;let it=ITEM.get(o.itemId),pending=o.reportWaitingAt!==null&&o.reportWaitingAt!==undefined;return `<div class="screen"><span class="eyebrow">APPRAISAL CENTER</span><h2 class="screen-title">鉴定中心</h2><div class="soft-card seller-row">${objectVisual(it,'product-visual')}<div class="list-content"><b>${E(it.name)}</b><p class="text-xs secondary">买入价 ${C(o.price)} C · ${o.appraisal==='expert'?'专家报告已生成':o.appraisal==='basic'?'已完成普通鉴定':'尚未鉴定'}</p></div></div>${o.appraisal!=='none'?`<div class="helper" style="margin:10px 0"><b>普通鉴定信息：</b> ${E(it.category)} · ${E(it.age)}。粗略游戏估值 ${C(Math.floor(it.value*.5))}～${C(Math.ceil(it.value*1.5))} C。<br>注意：此阶段不展示专家的完整论证。</div>`:''}${o.appraisal==='expert'?`<div class="soft-card center" style="margin:12px 0"><div style="font-size:30px">📜</div><b>专家报告已完成</b><p class="text-xs secondary">你可以随时查看证据与复盘。</p>${button('阅读完整报告','go','PG-17','coral-bg full')}</div>`:`${section('选择鉴定方式')}<div class="click-card"><span class="circle-icon">🧾</span><span class="list-content"><b>普通鉴定</b><small>今日首次免费，之后15C；仅识别类别与粗略估值</small></span><button class="btn sm light" data-act="basic-appraise" ${o.appraisal!=='none'?'disabled':''}>${S.basicFreeDay===S.day?'15C':'免费'}</button></div><div class="click-card"><span class="circle-icon">🧪</span><span class="list-content"><b>专家鉴定</b><small>新增证据、±10%估值、完整错因复盘</small></span><button class="btn sm coral-bg" data-act="expert-cash">60 C</button></div><div class="click-card"><span class="circle-icon">🎫</span><span class="list-content"><b>使用报告快通券</b><small>当前拥有 ${S.tools.cert||0} 张 · 不改变真假</small></span><button class="btn sm light" data-act="expert-cert" ${!S.tools.cert?'disabled':''}>使用</button></div><div class="click-card"><span class function chapterInfo(npc){let state=npcState(npc),next=state.chapter+1;let dialogs=D.dialogues.filter(d=>d.npc===npc&&d.chapter===next);let eligible=next<=3 && (next===1 || (next===2?state.aff>=25:state.aff>=60)) && (next===1 || S.day>state.lastChapterDay) && state.chatCount<2;if(next>3)return {next,dialogs:[],eligible:false,reason:'三章主线已完成；你们的日常关系还能继续成长。'};
 let reason=next===2&&state.aff<25?'好感达到25后解锁第二章':next===3&&state.aff<60?'好感达到60后解锁第三章':next>1&&S.day<=state.lastChapterDay?'第二天再次见面才会出现新的剧情':state.chatCount>=2?'今天聊天次数已满':'已解锁';return {next,dialogs,eligible,reason}}
